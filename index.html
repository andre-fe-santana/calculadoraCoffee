<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Coffee Break</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <main>

        <div id="flip-card">
            <form id="flip-card-inner">
                <div class="form-content" id="cardFront">
                    <div class="form-title">
                        <h2>Qual Coffee Devo Pedir?</h2>
                    </div>

                    <hr>

                    <!-- número de pessoas -->
                    <div class="inputForm">
                        <label for="personQty">
                            <i class="fa-solid fa-people-group"></i>
                            Quantas pessoas serão?
                        </label>
                        <input type="number" name="personQty" id="personQty" min="15" placeholder="Mín: 15 pessoas" required>
                        <span class="errorMsg" id="errorQty"></span>
                    </div>
                    <div class="inputForm">
                        <label for="coffeeBudget" class="">
                            <i class="fa-solid fa-money-bill-1-wave"></i>
                            Qual o orçamento do Coffee?
                        </label>
                        <input type="number" name="coffeeBudget" id="coffeeBudget" placeholder="Mín: R$516,00" min="516.00" required>
                        <span class="errorMsg" id="errorBudget"></span>
                    </div>
                    <div class="inputForm">
                        <label>
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            Qual o nível de importância desse Coffee?
                        </label>
            
                        <div class="radio-options">
                            <label for="coffeeLow">
                                <input type="radio" name="coffeePriority" id="coffeeLow" value="Low" required>
                                Baixo
                            </label>
                            <label for="coffeeMid">
                                <input type="radio" name="coffeePriority" id="coffeeMid" value="Mid">
                                Médio
                            </label>
                            <label for="coffeeHigh">
                                <input type="radio" name="coffeePriority" id="coffeeHigh" value="High">
                                Alto
                            </label>
                        </div>
                    </div>
                    <div class="form-submit">
                        <input type="button" value="Calcular" onclick="calculate()">
                    </div>
                </div>
                <div class="form-return" id="cardBack">
                    <h4 id="coffeeTitle">Seu Coffee Ideal é</h4>
                    <h1 id="coffeeType"></h1>
                    <h4 id="totalCost"></h4>
                    <span id="individualCost"></span>

                    <label onclick="reset()" id="btn-reset">
                        <img src="img/restart.svg" alt="Resetar aplicação">
                    </label>
            
                </div>
            </form>
        </div>
    </main>

    <footer>
        <a href="https://github.com/andre-fe-santana" target="_blank">
            <div class="footer-content">
                    <img src="img/github.svg" alt="Logo do Github" draggable="false">
                    <span>@andre-fe-santana</span>
            </div>
        </a>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
